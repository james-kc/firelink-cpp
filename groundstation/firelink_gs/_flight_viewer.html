  } else rows.push(['Max baro alt', '-']);
  const mag = magArray(D.ax, D.ay, D.az);
  if (mag.length) {
    const am = argmax(mag);
    rows.push(['Max |a|', fmt(mag[am] / G, 2) + ' g @ ' + fmt(D.accel_t[am], 1) + ' s']);
  } else rows.push(['Max |a|', '-']);
  if (vel.v.length) {
    const vm = argmax(vel.v);
    rows.push(['Max velocity', fmt(vel.v[vm], 1) + ' m/s @ ' + fmt(vel.t[vm], 1) + ' s']);
  } else rows.push(['Max velocity', '-']);
  rows.push(['Pad pressure', D.pad_hpa != null ? fmt(D.pad_hpa, 2) + ' hPa' : '-']);
  if (D.cpm.length) rows.push(['Peak geiger', fmt(Math.max.apply(null, D.cpm), 1) + ' CPM']);
  rows.push(['GPS fixes', String(D.gps_lat.length)]);
  const states = D.states.filter(s => s.to === 'LANDED');
  rows.push(['Landing', states.length ? 'YES' : (D.states.length ? 'not in log' : '-')]);
  $('stats').innerHTML = rows.map(([k, v]) =>
    `<div class="kv"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
}

function renderStrip() {
  const el = $('strip');
  if (!D.states.length) { el.innerHTML = '<span style="font-size:11px;color:#8b949e;padding:6px">no state transitions recorded</span>'; return; }
  const all = D.states;
  const tEnd = Math.max.apply(null, [D.baro_t[D.baro_t.length-1], D.accel_t[D.accel_t.length-1]].filter(isFinite));
  const span = Math.max(1, (isFinite(tEnd) ? tEnd : (all[all.length-1].t || 1)) - all[0].t);
  let html = '';
  for (let i = 0; i < all.length; i++) {
    const s = all[i], end = i + 1 < all.length ? all[i+1].t : (isFinite(tEnd) ? tEnd : s.t + span);
    const left = (s.t - all[0].t) / span * 100, w = (end - s.t) / span * 100;
    html += `<i class="st-${s.to}" title="${s.from} -> ${s.to} ${s.reason||''} @ ${s.t.toFixed(1)}s" style="left:${left}%;width:${Math.max(0.5, w)}%"></i>`;
  }
  el.innerHTML = html;
}

function renderEvents() {
  const rows = D.events.map(e => `<tr><td>${fmt(e.t, 1)} s</td><td>${e.text.replace(/</g, '&lt;')}</td></tr>`).join('');
  $('events').innerHTML = D.events.length ? ('<tr><th>t (s)</th><th>event</th></tr>' + rows)
    : '<tr><td class="missing">no events logged</td></tr>';
}

function render() {
  const vel = derivedVelocity();
  drawChart($('alt-canvas'), [
    { label: 'baro', ts: D.baro_t, vs: D.baro_alt, color: '#58a6ff' },
    { label: 'gps', ts: D.gps_t, vs: D.gps_alt, color: '#f0883e', dash: true },
  ].filter(s => s.ts.length), { title: 'baro & GPS altitude (m) vs time' });
  const mag = magArray(D.ax, D.ay, D.az).map(v => v / G);
  const load = vel.load.length ? vel.load : [];
  const accSeries = [{ ts: D.accel_t, vs: mag, color: '#d2a8ff' }];
  if (load.length) accSeries.push({ ts: vel.t, vs: load, color: '#7ee787' });
  accSeries.push({ ts: [D.accel_t[0] || 0, D.accel_t[D.accel_t.length - 1] || 1], vs: [1, 1], color: '#8b949e', dash: true });
  drawChart($('acc-canvas'), accSeries.filter(s => s.ts.length || s.vs.length), { title: 'acceleration (g) vs time' });
  const baroV = baroVelocity();
  drawChart($('vel-canvas'), [
    { label: 'int', ts: vel.t, vs: vel.v, color: '#f0883e' },
    { label: 'baro', ts: baroV.t, vs: baroV.v, color: '#8b949e', dash: true },
  ].filter(s => s.ts.length), { title: 'velocity (m/s) vs time' });
  drawTrack();
  buildStats(vel);
  renderStrip();
  renderEvents();
}

// ---- session plumbing ----
function modeConfig() {
  const p = new URLSearchParams(location.search);
  const s = p.get('session');
  if (s) return { mode: 'pi', name: s, base: '/data/' + encodeURIComponent(s) + '/' };
  const m = location.pathname.match(/^\/flights\/([^/]+)\/?$/);
  if (m) return { mode: 'gs', name: decodeURIComponent(m[1]), base: '/flights/' + m[1] + '/' };
  return null;
}
const MODE = modeConfig();

async function loadSession(cfg) {
  resetD();
  D.name = cfg.name;
  $('session-name').textContent = cfg.name;
  $('msg').textContent = '';
  try {
    if (cfg.mode === 'pi') {
      const [baro, accel, gps, gei, ev] = await Promise.all([
        fetchText(cfg.base + 'barometer.csv').catch(() => ''),
        fetchText(cfg.base + 'accelerometer.csv').catch(() => ''),
        fetchText(cfg.base + 'gps.csv').catch(() => ''),
        fetchText(cfg.base + 'geiger.csv').catch(() => ''),
        fetchText(cfg.base + 'events.log').catch(() => ''),
      ]);
      ingestBaro(toObjects(csvParse(baro)));
      ingestAccel(toObjects(csvParse(accel)), false);
      ingestGps(toObjects(csvParse(gps)));
      ingestGeiger(toObjects(csvParse(gei)));
      ingestEvents(ev);
    } else {
      const csv = await fetchText(cfg.base + 'telemetry.csv');
      const rows = toObjects(csvParse(csv));
      ingestBaro(rows);
      ingestAccel(rows, true);
      ingestGps(rows);
      ingestGeiger(rows);
      ingestStates(rows);
      D.name = cfg.name;
    }
    render();
  } catch (e) {
    $('msg').textContent = 'Failed to load session data: ' + e.message;
    const can = [['baro', D.baro_t], ['accel', D.accel_t], ['gps', D.gps_t]];
    if (!can.some(c => c[1].length)) {
      $('stats').innerHTML = '<div class="kv"><div class="v">No data</div></div>';
    }
  }
}

async function fillSessions() {
  const sel = $('sessions');
  const opt = document.createElement('option'); opt.value = ''; opt.textContent = 'choose a session\u2026';
  sel.appendChild(opt);
  let list = [];
  try {
    if (MODE.mode === 'pi') {
      const j = await (await fetch('/api/data')).json();
      list = (j.sessions || []).map(s => ({ name: s.name }));
    } else {
      const j = await (await fetch('/flights/list.json')).json();
      list = (j.sessions || []).map(s => ({ name: s.name }));
    }
  } catch (e) { return; }
  for (const s of list) {
    const o = document.createElement('option'); o.value = s.name; o.textContent = s.name;
    sel.appendChild(o);
  }
  sel.value = MODE.name;
  sel.onchange = () => {
    const base = MODE.mode === 'pi' ? '/flight?session=' : '/flights/';
    location.href = base + encodeURIComponent(sel.value);
  };
}

if (MODE) {
  $('back').textContent = MODE.mode === 'pi' ? '\u2190 control page' : '\u2190 live map';
  if (MODE.mode === 'gs') $('back').href = '/';
  fillSessions();
  loadSession(MODE);
} else {
  $('msg').textContent = 'no session requested (use ?session=<name> or /flights/<name>)';
  $('stats').innerHTML = '<div class="kv"><div class="v">-</div></div>';
}
window.addEventListener('resize', () => { if (MODE) render(); });
</script>
</body>
